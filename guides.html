<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Guides & Groups - Foodies For Foodies</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Page Specific Styles */
        .hero {
            background: transparent;
            text-align: center;
            padding: 4rem 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            font-family: var(--font-heading);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .guide-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .guide-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .guide-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .guide-content {
            padding: 1.5rem;
        }

        .guide-content h3 {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .guide-meta {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .guide-content p {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .learn-btn {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .learn-btn:hover {
            background: var(--primary-color);
            color: #121212;
        }

        .group-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .group-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #121212;
        }

        .group-info h3 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-bottom: 0.25rem;
            color: white;
        }

        .group-members {
            font-size: 0.9rem;
            color: #888;
        }

        .join-group-btn {
            background: var(--primary-color);
            color: #121212;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            font-weight: 600;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .join-group-btn:hover {
            background: #e5c14f;
        }

        .join-group-btn.joined {
            background: transparent;
            border: 1px solid #4caf50;
            color: #4caf50;
        }
    </style>
</head>

<body>
    <!-- Background Image -->
    <img src="assets/images/category_cooking_1771292659599.png" alt="Cooking Background" class="bg-image">

    <!-- Mobile Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <h1>Foodies</h1>
            <p>For Foodies</p>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="fridge.html">🥑 My Fridge</a></li>
            <li><a href="guides.html" class="active">📚 Guides & Groups</a></li>
            <li><a href="events.html">📅 Events</a></li>
            <li><a href="travel.html">✈️ Travel</a></li>
            <li><a href="podcast.html">🎙️ Podcast</a></li>
            <li><a href="polls.html">📊 Polls</a></li>
            <li><a href="rewards.html">🏆 Rewards</a></li>
        </ul>
        <a href="sign-in.html" class="sign-in-btn">Sign In</a>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <section class="hero">
            <div class="hero-content">
                <span class="category-badge">Learn & Connect</span>
                <h2>Cooking Guides <span>& Communities</span></h2>
                <p>Master culinary skills from experts and join passionate food communities.</p>
            </div>
        </section>

        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('guides')">📚 Guides</button>
                <button class="tab-btn" onclick="showTab('groups')">👫 Groups</button>
            </div>

            <div id="guides-tab">
                <div class="guide-grid" id="guidesGrid"></div>
            </div>

            <div id="groups-tab" style="display: none;">
                <div id="groupsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        // Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('sidebarToggle');
        const body = document.body;

        toggle.addEventListener('click', () => {
            if (sidebar.classList.contains('active')) {
                body.classList.remove('nav-open');
            } else {
                body.classList.add('nav-open');
            }
            sidebar.classList.toggle('active');
            toggle.innerHTML = sidebar.classList.contains('active') ? '×' : '☰';
        });

        const guides = [
            { emoji: '🔪', title: 'Knife Skills Masterclass', difficulty: 'Beginner', duration: '45 min', desc: 'Learn essential knife techniques' },
            { emoji: '🍳', title: 'Perfect Omelette Technique', difficulty: 'Beginner', duration: '30 min', desc: 'Master the art of the perfect omelette' },
            { emoji: '🥩', title: 'Steak Perfection', difficulty: 'Intermediate', duration: '60 min', desc: 'Cook restaurant-quality steaks' },
            { emoji: '🍝', title: 'Homemade Pasta', difficulty: 'Intermediate', duration: '90 min', desc: 'Make fresh pasta from scratch' },
            { emoji: '🧂', title: 'Seasoning & Flavoring', difficulty: 'Beginner', duration: '40 min', desc: 'Balance flavors like a pro' },
            { emoji: '🍲', title: 'Soup Stock Basics', difficulty: 'Beginner', duration: '120 min', desc: 'Create rich, flavorful stocks' }
        ];

        const groups = [
            { emoji: '🍕', name: 'Pizza Enthusiasts', members: 1234, desc: 'For pizza lovers and makers worldwide' },
            { emoji: '🥗', name: 'Healthy Eating', members: 2156, desc: 'Share nutritious recipes and tips' },
            { emoji: '🍜', name: 'Asian Cuisine', members: 1876, desc: 'Explore flavors of Asia' },
            { emoji: '🍰', name: 'Baking & Pastry', members: 3421, desc: 'Sweet creations and baking techniques' },
            { emoji: '🌱', name: 'Vegan Cooking', members: 2345, desc: 'Plant-based culinary adventures' },
            { emoji: '🧆', name: 'Mediterranean Foods', members: 1567, desc: 'Mediterranean diet and recipes' }
        ];

        function showTab(tab) {
            document.querySelectorAll('[id$="-tab"]').forEach(el => el.style.display = 'none');
            document.getElementById(tab + '-tab').style.display = 'block';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function renderGuides() {
            const grid = document.getElementById('guidesGrid');
            grid.innerHTML = guides.map(guide => `
                <div class="guide-card">
                    <div class="guide-image">${guide.emoji}</div>
                    <div class="guide-content">
                        <h3>${guide.title}</h3>
                        <div class="guide-meta">${guide.difficulty} • ${guide.duration}</div>
                        <p>${guide.desc}</p>
                        <button class="learn-btn">Learn Now</button>
                    </div>
                </div>
            `).join('');
        }

        function renderGroups() {
            const grid = document.getElementById('groupsGrid');
            const joined = JSON.parse(localStorage.getItem('joinedGroups')) || [];
            grid.innerHTML = groups.map((group, idx) => `
                <div class="group-card">
                    <div class="group-header">
                        <div class="group-avatar">${group.emoji}</div>
                        <div class="group-info">
                            <h3>${group.name}</h3>
                            <div class="group-members">👥 ${group.members} members</div>
                        </div>
                    </div>
                    <p style="color: #ccc; margin-bottom: 1rem;">${group.desc}</p>
                    <button class="join-group-btn ${joined.includes(idx) ? 'joined' : ''}" onclick="toggleGroup(${idx})">
                        ${joined.includes(idx) ? '✓ Joined' : 'Join Group'}
                    </button>
                </div>
            `).join('');
        }

        function toggleGroup(idx) {
            let joined = JSON.parse(localStorage.getItem('joinedGroups')) || [];
            if (joined.includes(idx)) {
                joined = joined.filter(i => i !== idx);
            } else {
                joined.push(idx);
            }
            localStorage.setItem('joinedGroups', JSON.stringify(joined));
            renderGroups();
        }

        renderGuides();
        renderGroups();
    </script>
</body>

</html>
